name: Update lottery data

on:
  workflow_dispatch:
  schedule:
    # 00:00 Asia/Taipei every day (16:00 UTC on the previous calendar day).
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official data
        shell: bash
        run: |
          if ! python collect_data.py; then
            echo "::error::Official lottery data collection failed; no data will be committed."
            exit 1
          fi
          python build_bulletin.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update official lottery results"
          git push
