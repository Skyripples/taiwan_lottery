name: Update lottery data

on:
  workflow_dispatch:
  schedule:
    # 21:30, 22:30, and 23:30 Asia/Taipei, Monday through Saturday.
    - cron: "30 13 * * 1-6"
    - cron: "30 14 * * 1-6"
    - cron: "30 15 * * 1-6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official data
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "${{ github.event.schedule }}" in
              "30 13 * * 1-6") attempt=1 ;;
              "30 14 * * 1-6") attempt=2 ;;
              "30 15 * * 1-6") attempt=3 ;;
              *) echo "::error::Unknown update schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          else
            attempt=0
          fi

          if python collect_data.py; then
            if ! python build_bulletin.py --attempt "$attempt"; then
              if [[ "$attempt" == "3" ]]; then
                python build_bulletin.py --attempt 3 --mark-expected-failed
              else
                exit 1
              fi
            fi
          elif [[ "$attempt" == "3" ]]; then
            python build_bulletin.py --attempt 3 --mark-expected-failed
          else
            exit 1
          fi
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update official lottery results"
          git push
