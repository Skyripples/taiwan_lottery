name: Update lottery data

on:
  workflow_dispatch:
  schedule:
    # 每日開獎後更新；UTC 14:30 為台灣時間 22:30。
    - cron: "30 14 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official data
        run: python collect_data.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update official lottery results"
          git push
